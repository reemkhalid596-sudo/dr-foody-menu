<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>د. فودي – المنيو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffbea;--card:#fff;--red:#b5121b;--amber:#fdb015;--ink:#3a0d10;--line:#e9c9a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0f10;--card:#3b1517;--red:#ffb4a8;--amber:#fdb015;--ink:#ffeccc;--line:#6b2a2a}}
:root[data-theme="dark"]{--bg:#2a0f10;--card:#3b1517;--red:#ffb4a8;--amber:#fdb015;--ink:#ffeccc;--line:#6b2a2a}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.6}
header{text-align:center;padding:28px 16px 12px;background:linear-gradient(135deg,#b5121b,#f26a1b);color:#fff}
.logo{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.3)}
header h1{margin:0;font-size:2.6rem;font-weight:900}
header p{margin:0;opacity:.9}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--bg);border-bottom:2px solid var(--amber)}
nav a{flex:none;padding:6px 14px;border-radius:99px;background:var(--amber);color:#5a0b10;text-decoration:none;font-weight:700;font-size:.95rem}
nav a:focus-visible{outline:3px solid var(--red)}
main{max-width:760px;margin:0 auto;padding:12px 14px 40px}
section{margin-top:26px}
h2{margin:0 0 2px;font-size:1.5rem;color:var(--red)}
.dx{margin:0 0 10px;font-size:.9rem;opacity:.75}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.item h3{margin:0;font-size:1.1rem;direction:ltr;text-align:right;color:var(--red)}
.item p{margin:2px 0 0;font-size:.9rem;opacity:.85}
.item img{width:88px;height:88px;object-fit:cover;border-radius:14px;flex:none;background:#fff2cc}.item img.c{object-fit:contain}.in{display:flex;gap:12px;align-items:center}
.pr{display:flex;gap:6px;flex:none}
.pr b{background:var(--amber);color:#5a0b10;border-radius:12px;padding:3px 12px;font-size:1.05rem;white-space:nowrap}
.pr small{font-weight:700;margin-inline-end:4px}
footer{text-align:center;padding:20px;opacity:.7;font-size:.9rem}
</style>
</head>
